name: Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "little-writer-companion/**"
      - ".github/workflows/linux.yml"

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: little-writer-companion/app/src-tauri -> target
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config build-essential file libfuse2 \
            libx11-dev libxtst-dev libxext-dev libxi-dev
      - name: Sync assets
        run: sh little-writer-companion/app/scripts/sync-assets.sh
      - name: Test
        working-directory: little-writer-companion/app/src-tauri
        run: cargo test
      - name: Build deb and AppImage
        working-directory: little-writer-companion/app/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - name: Name the packages
        working-directory: little-writer-companion/app/src-tauri
        run: |
          ver=$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')
          mkdir -p dist
          cp target/release/bundle/deb/*.deb "dist/Little-Author-Buddy_${ver}_amd64.deb"
          cp target/release/bundle/appimage/*.AppImage "dist/Little-Author-Buddy_${ver}_amd64.AppImage"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: Little-Author-Buddy-linux
          if-no-files-found: error
          path: little-writer-companion/app/src-tauri/dist/*
      - name: Publish the packages
        working-directory: little-writer-companion/app/src-tauri
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c 'import json; print(json.load(open("tauri.conf.json"))["version"])')
          tag="v$ver"
          gh release view "$tag" --repo Epic-Problem-Solver/Little-Author-Buddy >/dev/null 2>&1 || gh release create "$tag" --repo Epic-Problem-Solver/Little-Author-Buddy --title "Little Author Buddy $ver" --notes "Release $ver."
          gh release upload "$tag" dist/Little-Author-Buddy_*.deb dist/Little-Author-Buddy_*.AppImage --clobber --repo Epic-Problem-Solver/Little-Author-Buddy
