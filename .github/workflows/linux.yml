name: Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "little-writer-companion/**"
      - ".github/workflows/linux.yml"

jobs:
  packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: little-writer-companion/app/src-tauri -> target
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev pkg-config build-essential file libfuse2 \
            libx11-dev libxtst-dev libxext-dev libxi-dev
      - name: Sync assets
        run: sh little-writer-companion/app/scripts/sync-assets.sh
      - name: Test
        working-directory: little-writer-companion/app/src-tauri
        run: cargo test
      - name: Build deb and AppImage
        working-directory: little-writer-companion/app/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
      - uses: actions/upload-artifact@v7
        with:
          name: Little-Author-Buddy-linux
          if-no-files-found: error
          path: |
            little-writer-companion/app/src-tauri/target/release/bundle/deb/*.deb
            little-writer-companion/app/src-tauri/target/release/bundle/appimage/*.AppImage
