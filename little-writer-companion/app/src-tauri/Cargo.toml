[package]
name = "little-writer-companion"
version = "0.9.1"
edition = "2021"

[lib]
name = "lwc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
ctrlc = { version = "3", features = ["termination"] }
# Check for update only. No updater plugin and no download.
ureq = "2.12"
# Activate reads a zip the user already saved. It does not download one.
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2", features = ["xlib", "xrecord"] }

[target.'cfg(target_os = "macos")'.dependencies]
block = "0.1"
core-foundation = "0.9"
libc = "0.2"
objc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Media_Control", "Foundation"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
