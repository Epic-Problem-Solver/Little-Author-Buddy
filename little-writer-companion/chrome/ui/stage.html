<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Little Author</title>
<link rel="stylesheet" href="assets/lw-character.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f6efe2; user-select: none; }
  #companion { z-index: 1; }
  #covers { position: absolute; inset: 0; z-index: 2; }
  #covers .shape { position: absolute; border: 3px solid #241414; border-radius: 4px; box-sizing: border-box; }
  #bubble { position: absolute; z-index: 4; top: 8px; left: 8px; right: 8px; display: none; background: #fff; border: 2px solid #241414; border-radius: 10px; padding: 4px 8px; font: 12px/1.3 system-ui, sans-serif; color: #241414; }
  #bubble.on { display: block; }
  #note { position: absolute; z-index: 4; left: 8px; right: 220px; bottom: 8px; display: none; background: #fff; border: 1px solid #241414; border-radius: 8px; padding: 4px 8px; font: 11px/1.3 system-ui, sans-serif; color: #241414; }
  #note.on { display: block; }
  #companion { position: absolute; width: 150px; transform-origin: 0 0; }
  #companion .clip { overflow: hidden; width: 150px; height: 137.5px; }
  #companion svg { width: 100%; height: 100%; display: block; }
  #hit { position: absolute; left: 75px; top: 68.75px; width: 80px; height: 80px; transform: translate(-50%, -50%); }
</style>
<script src="../files.js"></script>
<script src="../host.js"></script>
</head>
<body>
<div id="bubble"></div>
<div id="note">Letter keys end the game. The cursor stays in this window.</div>
<div id="companion"><div class="clip" id="charHost"></div><div id="hit"></div></div>
<script src="domain.js"></script>
<script src="motion.js"></script>
<script src="assets/lw-color.js"></script>
<script src="character.js"></script>
<script src="content.js"></script>
<script src="games.js"></script>
<script src="stage.js"></script>
</body>
</html>
