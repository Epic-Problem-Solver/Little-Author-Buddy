    <path d="M60 84 C66 66 82 48 104 38 C112 34 120 32 128 34 C150 38 166 48 174 66 C180 80 178 90 176 90 C154 90 86 90 62 88 C56 86 56 86 60 84 Z" fill="none" stroke="var(--outline)" stroke-width="6" stroke-linejoin="round"/>
